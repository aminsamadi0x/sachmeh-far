<style>
.chatbox{display:flex;flex-direction:column;height:min(70vh,640px);border-radius:28px;overflow:hidden;border:1px solid rgba(205,220,238,.25);background:linear-gradient(170deg,rgba(10,58,145,.22),rgba(3,11,26,.92))}
