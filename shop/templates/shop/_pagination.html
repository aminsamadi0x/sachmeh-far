{% if is_paginated %}
<div class="pg">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">قبلی</a>{% endif %}
  {% for n in paginator.page_range %}{% if n == page_obj.number %}<span class="cur">{{ n }}</span>{% else %}<a href="?page={{ n }}">{{ n }}</a>{% endif %}{% endfor %}
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">بعدی</a>{% endif %}
</div>
{% endif %}
